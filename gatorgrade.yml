# Fifteen checks. Each class is checked on its own: the Light and Button checks make objects of
# your class on a pretend board, and the Stoplight checks give your class pretend lights and a
# pretend button, so a check passes or fails on its own file whatever state the others are in.
# The program check runs all four files together and reads only the stoplight log. Time passes
# only when your code calls sleep. Pull main before you run the checks, so you have every
# teammate's merged work.

- description: "[LIGHT] Light(pin_number, color) stores color, lit as False and times_lit as 0; on() lights the LED, sets lit and adds 1 to times_lit; off() turns it off and sets lit to False"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_stoplight.py::test_a_light_turns_on_and_off_and_counts

- description: "[BUTTON] Button(pin_number) starts with presses at 0, and check() returns True once for each new press, adding 1 to presses: a button held down for several checks is one press"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_stoplight.py::test_a_button_counts_each_new_press

- description: "[STOPLIGHT] show(color) turns on the light of that color and turns every other light off, and all_off() turns them all off"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_stoplight.py::test_show_lights_one_color_and_turns_the_others_off

- description: "[STOPLIGHT] A normal cycle shows red for 3 seconds, green for 3 and yellow for 1, and adds 1 to cycles"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_stoplight.py::test_the_normal_cycle_is_red_green_yellow

- description: "[STOPLIGHT] A flashing red or flashing yellow cycle shows its color for half a second, then every light off for half a second"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_stoplight.py::test_the_flashing_modes_flash_once_per_cycle

- description: "[STOPLIGHT] A press during a cycle sets requested, and the mode moves to the next one only when the cycle ends, back to normal after flashing yellow"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_stoplight.py::test_a_press_changes_the_mode_when_the_cycle_ends

- description: "[PROGRAM] main runs the cycles it is asked for and logs Cycles, Mode, Presses and Red lit, with every light off at the end"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_stoplight.py::test_the_program_runs_the_stoplight_and_logs_it

- description: "[CODE] Stoplight keeps its lights in a dictionary attribute, run_cycle calls self.show and self.wait, and wait calls the button's check()"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_the_stoplight_keeps_its_lights_in_a_dictionary_and_uses_its_own_methods

- description: "[CODE] main.py imports Light, Button and Stoplight from their files, and makes three Light objects, a Button and a Stoplight"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_main_imports_each_class_and_makes_the_objects

- description: "[GIT] At least four pull requests are merged with Merge pull request, one for each file"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_pull_requests_were_merged

- description: "[GIT] The files in src have commits from at least two teammates"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_teammates_each_committed_to_src

- description: "[CODE] No TODO markers remain in any file in src: delete each one once its code is written, including Author"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_no_file_has_a_todo

- description: "[CODE] Each file in src has at least two comments: say why, not what the line already says"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_each_file_has_two_comments

- docs/summary.md:
  - description: "[SUMMARY] No TODO markers remain in docs/summary.md: replace each one with your answer, then delete it"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: "[SUMMARY] At least 250 words in docs/summary.md: each teammate answers the question for their own file, and the team answers the last one together"
    check: CountFileWords
    options:
      count: 250
      exact: false
